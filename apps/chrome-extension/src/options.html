<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Resource Console 设置</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="options-page">
    <main class="panel options-panel">
      <header class="header">
        <div>
          <p class="eyebrow">VRC</p>
          <h1>插件设置</h1>
        </div>
        <span class="status-dot" id="statusDot"></span>
      </header>

      <section class="service-box">
        <label for="apiBaseUrl">服务地址</label>
        <div class="input-row">
          <input id="apiBaseUrl" type="url" spellcheck="false" placeholder="http://vrc-server:3987" />
          <button id="saveButton" type="button">保存</button>
        </div>
      </section>

      <section class="health" id="healthBox">
        <p class="health-title" id="healthTitle">未检测</p>
        <p class="health-detail" id="healthDetail">建议填写内网部署地址，或本机客户端启动的 http://127.0.0.1:3987。</p>
      </section>

      <div class="actions">
        <button id="openButton" type="button" class="primary">打开控制台</button>
        <button id="checkButton" type="button" class="secondary">检测服务</button>
      </div>
      <button id="startButton" type="button" class="wide-action">启动本机服务</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
