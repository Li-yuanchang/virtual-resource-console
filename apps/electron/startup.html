<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VRC</title>
    <style>
      :root {
        --startup-bg: #f5f6f2;
        --startup-surface: #fbfbf7;
        --startup-border: #d9ded0;
        --startup-text: #27302a;
        --startup-muted: #747b70;
        --startup-accent: #426b57;
        --startup-logo-fg: #f7fbf2;
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--startup-text);
        background: var(--startup-bg);
        transition: background-color 420ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      body { user-select: none; }

      .window-drag-region {
        position: fixed;
        z-index: 4;
        top: 0;
        right: 0;
        left: 0;
        height: 38px;
        -webkit-app-region: drag;
      }

      .startup-shell {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        transition: opacity 380ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .is-complete .startup-shell { opacity: 0; }
      .is-complete,
      .is-complete body { background-color: transparent; }

      .startup-center {
        display: grid;
        justify-items: center;
        width: min(320px, calc(100vw - 64px));
        transform: translateY(-10px);
      }

      .startup-mark {
        position: relative;
        display: grid;
        width: 104px;
        height: 104px;
        margin-bottom: 20px;
        place-items: center;
      }

      .startup-logo {
        position: relative;
        z-index: 2;
        width: 78px;
        height: 78px;
        object-fit: contain;
        animation:
          startup-logo-enter 620ms cubic-bezier(0.22, 1, 0.36, 1) both,
          startup-logo-breathe 1.7s 620ms ease-in-out infinite;
      }

      .startup-ring {
        position: absolute;
        border: 1px solid color-mix(in srgb, var(--startup-accent) 24%, transparent);
        border-radius: 50%;
      }

      .startup-ring-outer {
        inset: 0;
        animation: startup-ring-breathe 1.7s 260ms ease-in-out infinite;
      }

      .startup-ring-inner {
        inset: 10px;
        border-color: color-mix(in srgb, var(--startup-accent) 13%, transparent);
        animation: startup-ring-breathe 1.7s 520ms ease-in-out infinite reverse;
      }

      .startup-scan {
        position: absolute;
        z-index: 3;
        top: 14px;
        left: 20px;
        width: 64px;
        height: 1px;
        background: color-mix(in srgb, var(--startup-logo-fg) 72%, transparent);
        box-shadow: 0 0 8px color-mix(in srgb, var(--startup-logo-fg) 45%, transparent);
        opacity: 0;
        animation: startup-logo-scan 1.55s 520ms ease-in-out infinite;
      }

      .startup-copy {
        display: grid;
        gap: 7px;
        justify-items: center;
      }

      .startup-copy h1,
      .startup-copy p {
        margin: 0;
        font-weight: 400;
        letter-spacing: 0;
      }

      .startup-copy h1 {
        font-size: 16px;
        line-height: 24px;
      }

      .startup-copy p {
        color: var(--startup-muted);
        font-size: 12px;
        line-height: 18px;
      }

      .startup-progress {
        width: 150px;
        height: 2px;
        margin-top: 18px;
        overflow: hidden;
        background: color-mix(in srgb, var(--startup-border) 72%, transparent);
        border-radius: 999px;
      }

      .startup-progress i {
        display: block;
        width: 42%;
        height: 100%;
        background: var(--startup-accent);
        border-radius: inherit;
        animation: startup-progress-travel 1.25s ease-in-out infinite;
      }

      @keyframes startup-logo-enter {
        from { opacity: 0.38; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes startup-logo-breathe {
        0%, 100% { transform: scale(0.98); }
        50% { transform: scale(1.025); }
      }

      @keyframes startup-ring-breathe {
        0%, 100% { opacity: 0.28; transform: scale(0.94); }
        50% { opacity: 0.8; transform: scale(1.04); }
      }

      @keyframes startup-logo-scan {
        0% { opacity: 0; transform: translateY(0); }
        18%, 76% { opacity: 0.65; }
        100% { opacity: 0; transform: translateY(75px); }
      }

      @keyframes startup-progress-travel {
        0% { transform: translateX(-105%); }
        52% { transform: translateX(92%); }
        100% { transform: translateX(242%); }
      }

    </style>
  </head>
  <body>
    <div class="window-drag-region" aria-hidden="true"></div>
    <main class="startup-shell">
      <section class="startup-center" aria-live="polite">
        <div class="startup-mark" aria-hidden="true">
          <span class="startup-ring startup-ring-outer"></span>
          <span class="startup-ring startup-ring-inner"></span>
          <img class="startup-logo" src="./assets/app-icon-1024.png" alt="" />
          <i class="startup-scan"></i>
        </div>
        <div class="startup-copy">
          <h1>Virtual Resource Console</h1>
          <p id="startup-status">正在启动本地服务</p>
        </div>
        <div class="startup-progress" aria-hidden="true"><i></i></div>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const colorKeys = ["bg", "surface", "border", "text", "muted", "accent", "logoFg"];
      for (const key of colorKeys) {
        const value = params.get(key);
        if (/^#[0-9a-f]{6}$/i.test(value || "")) {
          document.documentElement.style.setProperty(`--startup-${key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}`, value);
        }
      }

      window.vrcStartup = {
        setStatus(message) {
          const status = document.getElementById("startup-status");
          if (status && typeof message === "string") status.textContent = message;
        },
        complete() {
          document.documentElement.classList.add("is-complete");
        },
      };
    </script>
  </body>
</html>
